services:
  knowledge-hub-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manufacturing-knowledge-hub
    ports:
      - "8000:8000"
    environment:
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/chat/completions}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  knowledge-hub-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manufacturing-knowledge-hub-ui
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      knowledge-hub-backend:
        condition: service_healthy
    restart: unless-stopped
